version: 2.1

orbs:
  gradle: circleci/gradle@3.0

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0

    resource_class: large

    steps:
      - checkout

      # Restore Gradle cache
      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum
              "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-v1-

      # Generate weekly cache key for OWASP NVD data
      - run:
          name: Generate OWASP cache key
          command: date +%Y-%V > /tmp/owasp-week.txt

      # Restore OWASP NVD database cache (keyed weekly so data stays reasonably fresh)
      - restore_cache:
          keys:
            - owasp-nvd-v1-{{ checksum "/tmp/owasp-week.txt" }}
            - owasp-nvd-v1-

      # Make gradlew executable
      - run:
          name: Make gradlew executable
          command: chmod +x gradlew

      # Build plugin
      - run:
          name: Build plugin
          command: ./gradlew build

      # Run tests
      - run:
          name: Run tests
          command: ./gradlew test

      # Verify plugin
      - run:
          name: Verify plugin
          command: ./gradlew verifyPlugin

      # Run static analysis (hard gate; NVD_API_KEY sourced from intellij-plugin-publication context)
      - run:
          name: Static analysis
          no_output_timeout: 45m
          command: ./gradlew staticAnalysis

      # Save Gradle cache
      - save_cache:
          key: gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum
            "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      # Save OWASP NVD database cache
      - save_cache:
          key: owasp-nvd-v1-{{ checksum "/tmp/owasp-week.txt" }}
          paths:
            - ~/.gradle/dependency-check-data

      # Store test results
      - store_test_results:
          path: build/test-results

      # Store all analysis reports (tests, detekt, ktlint, OWASP, jacoco)
      - store_artifacts:
          path: build/reports
          destination: analysis-reports

      # Sign plugin (requires signing credentials from context; skipped if unavailable)
      - run:
          name: Sign plugin
          command: |
            if [ -n "${CERTIFICATE_CHAIN:-}" ]; then
              ./gradlew signPlugin
            else
              echo "Signing credentials not available, skipping."
            fi

      # Store plugin distribution (includes signed zip when credentials are available)
      - store_artifacts:
          path: build/distributions
          destination: plugin-distribution

  publish-github:
    docker:
      - image: cimg/openjdk:21.0

    resource_class: large

    steps:
      - checkout

      # Restore Gradle cache
      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum
              "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-v1-

      # Make gradlew executable
      - run:
          name: Make gradlew executable
          command: chmod +x gradlew

      # Install GitHub CLI
      - run:
          name: Install GitHub CLI
          command: |
            type -p curl >/dev/null || sudo apt install curl -y
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) \
              signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
              https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update && sudo apt install gh -y

      # Build and sign plugin
      - run:
          name: Build plugin
          command: ./gradlew buildPlugin

      - run:
          name: Sign plugin
          command: ./gradlew signPlugin

      # Create GitHub Release
      # RC tags (v*-rc.*) create a pre-release and skip updatePlugins.xml.
      # Release tags (v*.*.*) create a full release and update updatePlugins.xml.
      - run:
          name: Create GitHub Release
          command: |
            TAG="${CIRCLE_TAG}"
            VERSION=$(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
            SIGNED_ZIP="build/distributions/circleci-idea-plugin-${VERSION}-signed.zip"

            if [[ "$TAG" == *-rc.* ]]; then
              PRERELEASE_FLAG="--prerelease"
            else
              PRERELEASE_FLAG=""
            fi

            gh release create "${TAG}" \
              --title "CircleCI ${TAG}" \
              --notes-file CHANGELOG.md \
              ${PRERELEASE_FLAG} \
              "${SIGNED_ZIP}"

            # Only update the plugin repository XML for full releases
            if [[ "$TAG" != *-rc.* ]]; then
              mkdir -p docs
              cat > docs/updatePlugins.xml \<< EOF
              <?xml version="1.0" encoding="UTF-8"?>
              <plugins>
                <plugin id="com.circleci.idea" url="https://github.com/circleci-petri/circleci-idea-plugin/releases/download/${TAG}/circleci-idea-plugin-${VERSION}-signed.zip" version="${VERSION}">
                  <name>CircleCI</name>
                  <description><![CDATA[
                    CircleCI integration for JetBrains IDEs.
                    Monitor, manage, and debug CircleCI pipelines directly within your IDE.
                  ]]></description>
                  <vendor email="support@circleci.com" url="https://circleci.com">CircleCI</vendor>
                  <idea-version since-build="243" until-build="253.*"/>
                  <change-notes><![CDATA[
                    See https://github.com/circleci-petri/circleci-idea-plugin/releases/tag/${TAG} for release notes.
                  ]]></change-notes>
                </plugin>
              </plugins>
              EOF

              git config user.email "ci@circleci.com"
              git config user.name "CircleCI"
              git add docs/updatePlugins.xml
              if ! git diff --cached --quiet; then
                git commit -m "Update plugin repository for ${TAG}"
                git push origin main
              fi
            fi

  publish-marketplace:
    docker:
      - image: cimg/openjdk:21.0

    resource_class: large

    steps:
      - checkout

      # Restore Gradle cache
      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum
              "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-v1-

      # Make gradlew executable
      - run:
          name: Make gradlew executable
          command: chmod +x gradlew

      # Build, sign, and publish to JetBrains Marketplace
      - run:
          name: Build plugin
          command: ./gradlew buildPlugin

      - run:
          name: Sign plugin
          command: ./gradlew signPlugin

      - run:
          name: Publish to JetBrains Marketplace
          command: ./gradlew publishPlugin

workflows:
  version: 2

  # Branch builds: run tests on every push, no publish steps
  ci:
    jobs:
      - build-and-test:
          context: intellij-plugin-publication
          filters:
            branches:
              only: /.*/

  # RC tags (e.g. v1.3.1-rc.1): test, then optionally create a GitHub pre-release.
  # Never publishes to the JetBrains Marketplace.
  rc:
    jobs:
      - build-and-test:
          context: intellij-plugin-publication
          filters:
            tags:
              only: /^v.*-rc\..*/
            branches:
              ignore: /.*/
      - hold-github:
          type: approval
          requires:
            - build-and-test
          filters:
            tags:
              only: /^v.*-rc\..*/
            branches:
              ignore: /.*/
      - publish-github:
          requires:
            - hold-github
          context: intellij-plugin-publication
          filters:
            tags:
              only: /^v.*-rc\..*/
            branches:
              ignore: /.*/

  # Release tags (e.g. v1.3.1): test, create GitHub release, then optionally publish
  # to the JetBrains Marketplace — each step behind its own approval gate.
  release:
    jobs:
      - build-and-test:
          context: intellij-plugin-publication
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - hold-github:
          type: approval
          requires:
            - build-and-test
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - publish-github:
          requires:
            - hold-github
          context: intellij-plugin-publication
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - hold-marketplace:
          type: approval
          requires:
            - publish-github
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - publish-marketplace:
          requires:
            - hold-marketplace
          context: intellij-plugin-publication
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/

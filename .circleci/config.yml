version: 2.1

orbs:
  gradle: circleci/gradle@3.0

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:17.0

    resource_class: large

    steps:
      - checkout

      # Restore Gradle cache
      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-v1-

      # Make gradlew executable
      - run:
          name: Make gradlew executable
          command: chmod +x gradlew

      # Build plugin
      - run:
          name: Build plugin
          command: ./gradlew build

      # Run tests
      - run:
          name: Run tests
          command: ./gradlew test

      # Verify plugin
      - run:
          name: Verify plugin
          command: ./gradlew verifyPlugin

      # Save Gradle cache
      - save_cache:
          key: gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      # Store test results
      - store_test_results:
          path: build/test-results

      # Store test reports
      - store_artifacts:
          path: build/reports/tests
          destination: test-reports

      # Store plugin distribution
      - store_artifacts:
          path: build/distributions
          destination: plugin-distribution

      # Store verification results
      - store_artifacts:
          path: build/reports/pluginVerifier
          destination: verification-reports

workflows:
  version: 2
  build-test-verify:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - main
                - develop

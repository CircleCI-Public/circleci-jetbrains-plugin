version: 2.1

executors:
  jdk:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: xlarge.gen2

commands:
  with-gradle-cache:
    description: |
      Run steps with this job's own Gradle caches: dependencies, wrapper and toolchains, and the
      build cache (compiled classes, test, detekt and ktlint results). Keyed as the Go orb keys
      its caches: on the job and the build files, with no fallback, and the build cache is
      refreshed every 3 days. Saved even if the steps fail.
    parameters:
      checksum:
        description: Checksum template for the files that decide the build's dependencies
        type: string
        default: '{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/gradle-daemon-jvm.properties" }}'
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - gradle-deps-v4-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-<< parameters.checksum >>
      - restore_cache:
          keys:
            - gradle-build-cache-v4-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-<< parameters.checksum >>-{{ epoch | round "72h" }}
      - steps: << parameters.steps >>
      # The IntelliJ IDEs (the compile target and the verifier's IDEs, ~17 GB zipped and
      # extracted) are left out: restoring them is slower than downloading them again. Gradle
      # downloads an artifact again when its cached file is missing.
      - run:
          name: Prune Gradle cache
          when: always
          command: |
            ./gradlew --stop || true
            rm -rf ~/.gradle/caches/modules-2/files-2.1/idea \
              ~/.gradle/caches/modules-2/files-2.1/com.jetbrains.intellij.idea
            find ~/.gradle/caches -name '*.lock' -delete
            rm -f ~/.gradle/caches/modules-2/gc.properties
      - save_cache:
          when: always
          key: gradle-deps-v4-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-<< parameters.checksum >>
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
            - ~/.gradle/jdks
      - save_cache:
          when: always
          key: gradle-build-cache-v4-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-<< parameters.checksum >>-{{ epoch | round "72h" }}
          paths:
            - ~/.gradle/caches/build-cache-1

  install-release-tools:
    description: Install Task and the GitHub CLI, if the image hasn't got them
    steps:
      - run:
          name: Install Task and the GitHub CLI
          command: |
            if ! command -v task >/dev/null; then
              curl --fail --silent --show-error --location https://taskfile.dev/install.sh \
                | sh -s -- -d -b "$HOME/.local/bin"
              echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            fi
            if ! command -v gh >/dev/null; then
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt-get update && sudo apt-get install -y gh
            fi

jobs:
  build-and-test:
    executor: jdk

    steps:
      - checkout
      - with-gradle-cache:
          steps:
            # Build and test plugin (includes detekt and ktlint)
            - run:
                name: Build plugin
                command: ./gradlew build

            # Verify plugin
            - run:
                name: Verify plugin
                command: ./gradlew verifyPlugin

            # Sign plugin (requires signing credentials from context; skipped if unavailable)
            - run:
                name: Sign plugin
                command: |
                  if [ -n "${CERTIFICATE_CHAIN:-}" ]; then
                    ./gradlew signPlugin
                  else
                    echo "Signing credentials not available, skipping."
                  fi

      # Store test results
      - store_test_results:
          path: build/test-results

      # Store all analysis reports (tests, detekt, ktlint, kover)
      - store_artifacts:
          path: build/reports
          destination: analysis-reports

      # Store plugin distribution (includes signed zip when credentials are available)
      - store_artifacts:
          path: build/distributions
          destination: plugin-distribution

  # OWASP dependency check, in parallel with the build (hard gate; NVD_API_KEY sourced from
  # intellij-plugin-publication context)
  dependency-check:
    executor: jdk

    steps:
      - checkout
      - with-gradle-cache:
          steps:
            # Refreshed daily. Unlike the Gradle caches it falls back to the latest, because without
            # one the NVD download starts from nothing
            - restore_cache:
                keys:
                  - owasp-nvd-v3-{{ epoch | round "24h" }}
                  - owasp-nvd-v3-

            - run:
                name: Update NVD database
                no_output_timeout: 45m
                command: ./gradlew dependencyCheckUpdate

            # Saved once the update succeeds, so a failed analysis doesn't throw the download away
            - save_cache:
                key: owasp-nvd-v3-{{ epoch | round "24h" }}
                paths:
                  - ~/.gradle/dependency-check-data

            - run:
                name: Dependency check
                command: ./gradlew dependencyCheckAnalyze

      - store_artifacts:
          path: build/reports
          destination: analysis-reports

  # Opens or updates the release PR from CHANGELOG.md's [Unreleased] section, or closes it when
  # nothing is unreleased. GITHUB_TOKEN, from devex-release, pushes its branch and opens it.
  release-pr:
    executor: jdk

    steps:
      - checkout
      - install-release-tools
      - with-gradle-cache:
          steps:
            - run:
                name: Update the release PR
                command: task ci:release:pr

  # Once a release PR is merged, publishes its version to the JetBrains Marketplace and makes
  # the GitHub release (and tag) with the signed plugin. Does nothing if the version is
  # released already. PUBLISH_TOKEN and the signing keys are from intellij-plugin-publication.
  release:
    executor: jdk

    steps:
      - checkout
      - install-release-tools
      - with-gradle-cache:
          steps:
            - run:
                name: Publish the release
                command: task ci:release:publish

workflows:
  # Tests every push. On main, also keeps the release PR up to date, and publishes once it's
  # merged.
  ci:
    jobs:
      - build-and-test:
          context: intellij-plugin-publication
          filters:
            branches:
              only: /.*/
      - dependency-check:
          context: intellij-plugin-publication
          filters:
            branches:
              only: /.*/
      - release-pr:
          # One at a time, so two pushes don't race to update the PR's branch.
          serial-group: << pipeline.project.slug >>/release-pr
          requires:
            - build-and-test
            - dependency-check
          context: devex-release
          filters:
            branches:
              only: main
      - release:
          # One at a time, so two merges can't both publish a version.
          serial-group: << pipeline.project.slug >>/release
          requires:
            - build-and-test
            - dependency-check
          context:
            - intellij-plugin-publication
            - devex-release
          filters:
            branches:
              only: main

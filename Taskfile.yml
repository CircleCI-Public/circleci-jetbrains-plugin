version: '3'

vars:
  REPO: CircleCI-Public/circleci-jetbrains-plugin
  MARKETPLACE_ID: 34719
  VERSION:
    sh: sed -n 's/^version = "\([^"]*\)".*/\1/p' build.gradle.kts
  BUILD_DIR: build/distributions
  PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-idea-plugin-{{.VERSION}}.zip"
  SIGNED_PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-idea-plugin-{{.VERSION}}-signed.zip"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development Tasks
  clean:
    desc: Clean build artifacts
    cmds:
      - ./gradlew clean

  build:
    desc: Build the plugin
    cmds:
      - ./gradlew buildPlugin
      - echo "✅ Plugin built at {{.PLUGIN_ZIP}}"

  test:
    desc: Run unit tests, verify plugin, and generate coverage report
    cmds:
      - ./gradlew test koverHtmlReport koverVerify verifyPlugin

  ui:start:
    desc: Start IDE with Remote Robot server for E2E testing
    cmds:
      - echo "🚀 Starting IDE with robot-server on port 8082..."
      - echo "💡 IDE will open in a new window. Keep this terminal running."
      - echo "💡 To run tests, open another terminal and run 'task ui:test'"
      - ./gradlew runIdeForUiTests

  ui:test:
    desc: Run E2E UI tests (requires IDE running via 'task ui:start')
    cmds:
      - ./gradlew test --tests "*E2ETest"

  ui:all:
    desc: Run all UI tests (starts IDE, runs tests, stops IDE)
    cmds:
      - echo "🚀 Starting IDE in background..."
      - ./gradlew runIdeForUiTests > /tmp/circleci-ui-test-ide.log 2>&1 &
      - echo $! > /tmp/circleci-ui-test-ide.pid
      - echo "⏳ Waiting for IDE to be ready (30 seconds)..."
      - sleep 30
      - echo "🧪 Running UI tests..."
      - ./gradlew test --tests "*E2ETest" || true
      - echo "🛑 Stopping IDE..."
      - kill $(cat /tmp/circleci-ui-test-ide.pid) || true
      - rm /tmp/circleci-ui-test-ide.pid
      - echo "✅ UI tests completed"

  run:
    desc: Launch IDE with plugin for testing
    cmds:
      - ./gradlew runIde

  # Static Analysis
  lint:
    desc: Run all static analysis (detekt, ktlint, security)
    cmds:
      - ./gradlew staticAnalysis

  format:
    desc: Auto-format code with ktlint
    cmds:
      - ./gradlew ktlintFormat

  # Release Tasks
  sign:
    desc: Sign the plugin artifact (requires CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD env vars)
    cmds:
      - ./gradlew signPlugin
      - echo "✅ Signed artifact at {{.SIGNED_PLUGIN_ZIP}}"

  ci:release:
    desc: Publish the release if a release PR was just merged, then update the release PR (in CI, with the signed plugin built)
    vars:
      RELEASE_PLEASE_ARGS: >-
        --token "$GITHUB_TOKEN"
        --repo-url {{.REPO}}
        --target-branch "$CIRCLE_BRANCH"
        --config-file .circleci/release/release-please-config.json
        --manifest-file .circleci/release/release-please-manifest.json
    cmds:
      # A no-op unless a release PR was just merged, when it makes that release and its tag.
      - npx release-please github-release {{.RELEASE_PLEASE_ARGS}}
      - task: ci:release:publish
      - npx release-please release-pr {{.RELEASE_PLEASE_ARGS}}

  ci:release:publish:
    internal: true
    status:
      # Only when this commit is the one just released.
      - test "$(git ls-remote origin refs/tags/v{{.VERSION}} | cut -f1)" != "$(git rev-parse HEAD)"
    cmds:
      - |
        curl --fail --silent --show-error --header "Authorization: Bearer $PUBLISH_TOKEN" \
          --form pluginId={{.MARKETPLACE_ID}} --form file=@{{.SIGNED_PLUGIN_ZIP}} \
          https://plugins.jetbrains.com/plugin/uploadPlugin
      - |
        upload_url=$(curl --fail --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/{{.REPO}}/releases/tags/v{{.VERSION}} | jq -r '.upload_url | sub("\\{.*"; "")')
        curl --fail --silent --show-error --output /dev/null --header "Authorization: Bearer $GITHUB_TOKEN" \
          --header "Content-Type: application/zip" --data-binary @{{.SIGNED_PLUGIN_ZIP}} \
          "$upload_url?name={{base .SIGNED_PLUGIN_ZIP}}"

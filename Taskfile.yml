version: '3'

vars:
  PLUGIN_NAME: CircleCI
  PLUGIN_ID: com.circleci.idea
  GITHUB_ORG: "{{.GITHUB_ORG | default \"circleci-petri\"}}"
  GITHUB_REPO: "{{.GITHUB_REPO | default \"circleci-idea-plugin\"}}"
  VERSION:
    sh: grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/'
  BUILD_DIR: build/distributions
  PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-idea-plugin-{{.VERSION}}.zip"
  DOCS_DIR: docs
  UPDATE_XML: "{{.DOCS_DIR}}/updatePlugins.xml"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development Tasks
  clean:
    desc: Clean build artifacts
    cmds:
      - ./gradlew clean
      - rm -rf {{.DOCS_DIR}}

  build:
    desc: Build the plugin
    cmds:
      - ./gradlew buildPlugin
      - echo "✅ Plugin built at {{.PLUGIN_ZIP}}"

  test:
    desc: Run tests and verify plugin
    cmds:
      - ./gradlew test verifyPlugin

  run:
    desc: Launch IDE with plugin for testing
    cmds:
      - ./gradlew runIde

  # Static Analysis
  lint:
    desc: Run all static analysis (detekt, ktlint, security)
    cmds:
      - ./gradlew staticAnalysis

  format:
    desc: Auto-format code with ktlint
    cmds:
      - ./gradlew ktlintFormat

  # Release Tasks
  release:
    desc: Full release (clean, test, build, publish to GitHub)
    cmds:
      - task: clean
      - task: test
      - task: _build-release
      - task: _publish-release
      - echo ""
      - echo "✅ Release v{{.VERSION}} completed!"
      - echo "📦 https://github.com/{{.GITHUB_ORG}}/{{.GITHUB_REPO}}/releases/tag/v{{.VERSION}}"

  release-quick:
    desc: Quick release (skip tests, useful for docs/minor fixes)
    cmds:
      - task: _build-release
      - task: _publish-release
      - echo ""
      - echo "✅ Release v{{.VERSION}} completed!"
      - echo "📦 https://github.com/{{.GITHUB_ORG}}/{{.GITHUB_REPO}}/releases/tag/v{{.VERSION}}"

  # Internal Tasks (prefixed with _)
  _build-release:
    internal: true
    cmds:
      - ./gradlew buildPlugin
      - mkdir -p {{.DOCS_DIR}}
      - |
        cat > {{.UPDATE_XML}} << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <plugins>
          <plugin id="{{.PLUGIN_ID}}" url="https://github.com/{{.GITHUB_ORG}}/{{.GITHUB_REPO}}/releases/download/v{{.VERSION}}/circleci-idea-plugin-{{.VERSION}}.zip" version="{{.VERSION}}">
            <name>{{.PLUGIN_NAME}}</name>
            <description><![CDATA[
              CircleCI integration for JetBrains IDEs.
              Monitor, manage, and debug CircleCI pipelines directly within your IDE.
            ]]></description>
            <vendor email="support@circleci.com" url="https://circleci.com">CircleCI</vendor>
            <idea-version since-build="232" until-build="241.*"/>
            <change-notes><![CDATA[
              See https://github.com/{{.GITHUB_ORG}}/{{.GITHUB_REPO}}/releases/tag/v{{.VERSION}} for release notes.
            ]]></change-notes>
          </plugin>
        </plugins>
        EOF

  _publish-release:
    internal: true
    cmds:
      - |
        # Create GitHub release
        if gh release view v{{.VERSION}} &> /dev/null; then
          echo "⚠️  Release v{{.VERSION}} exists, deleting..."
          gh release delete v{{.VERSION}} -y
        fi
        gh release create v{{.VERSION}} \
          --title "{{.PLUGIN_NAME}} v{{.VERSION}}" \
          --notes-file CHANGELOG.md \
          {{.PLUGIN_ZIP}}
      - |
        # Update plugin repository
        git add {{.DOCS_DIR}}
        if ! git diff --cached --quiet; then
          git commit -m "Update plugin repository for v{{.VERSION}}"
          git push origin main
        fi

version: '3'

vars:
  VERSION:
    sh: sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts
  BUILD_DIR: build/distributions
  PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-jetbrains-plugin-{{.VERSION}}.zip"
  SIGNED_PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-jetbrains-plugin-{{.VERSION}}-signed.zip"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development Tasks
  clean:
    desc: Clean build artifacts
    cmds:
      - ./gradlew clean

  build:
    desc: Build the plugin
    cmds:
      - ./gradlew buildPlugin
      - echo "✅ Plugin built at {{.PLUGIN_ZIP}}"

  sources:
    desc: Unpack the IntelliJ Platform's sources, Jewel's included, to search and read
    vars:
      IDE_VERSION:
        sh: sed -n 's/.*intellijIdea("\(.*\)").*/\1/p' build.gradle.kts
      JAR_NAME: idea-{{.IDE_VERSION}}-sources.jar
      DIR: .intellijPlatform/sources/{{.IDE_VERSION}}
    status:
      - test -d {{.DIR}}
    cmds:
      - mkdir -p .intellijPlatform/sources
      - |
        jar=$(ls ~/.gradle/caches/modules-2/files-2.1/com.jetbrains.intellij.idea/idea/{{.IDE_VERSION}}/*/{{.JAR_NAME}} 2>/dev/null | head -1)
        if [ -z "$jar" ]; then
          jar=.intellijPlatform/sources/{{.JAR_NAME}}
          curl -fsSL -o "$jar" https://www.jetbrains.com/intellij-repository/releases/com/jetbrains/intellij/idea/idea/{{.IDE_VERSION}}/{{.JAR_NAME}}
        fi
        unzip -q -o "$jar" -d {{.DIR}}.tmp && mv {{.DIR}}.tmp {{.DIR}}
      - echo "✅ IntelliJ Platform {{.IDE_VERSION}} sources in {{.DIR}}"

  test:
    desc: Run unit tests, verify plugin, and generate coverage report
    cmds:
      - ./gradlew test koverHtmlReport koverVerify verifyPlugin

  ui:start:
    desc: Start IDE with Remote Robot server for E2E testing
    cmds:
      - echo "🚀 Starting IDE with robot-server on port 8082..."
      - echo "💡 IDE will open in a new window. Keep this terminal running."
      - echo "💡 To run tests, open another terminal and run 'task ui:test'"
      - ./gradlew runIdeForUiTests

  ui:test:
    desc: Run E2E UI tests (requires IDE running via 'task ui:start')
    cmds:
      - ./gradlew test --tests "*E2ETest"

  ui:all:
    desc: Run all UI tests (starts IDE, runs tests, stops IDE)
    cmds:
      - echo "🚀 Starting IDE in background..."
      - ./gradlew runIdeForUiTests > /tmp/circleci-ui-test-ide.log 2>&1 &
      - echo $! > /tmp/circleci-ui-test-ide.pid
      - echo "⏳ Waiting for IDE to be ready (30 seconds)..."
      - sleep 30
      - echo "🧪 Running UI tests..."
      - ./gradlew test --tests "*E2ETest" || true
      - echo "🛑 Stopping IDE..."
      - kill $(cat /tmp/circleci-ui-test-ide.pid) || true
      - rm /tmp/circleci-ui-test-ide.pid
      - echo "✅ UI tests completed"

  run:
    desc: Launch IDE with plugin for testing
    cmds:
      - ./gradlew runIde

  # Static Analysis
  lint:
    desc: Run all static analysis (detekt, ktlint, security)
    cmds:
      - ./gradlew staticAnalysis

  format:
    desc: Auto-format code with ktlint
    cmds:
      - ./gradlew ktlintFormat

  # Release Tasks
  sign:
    desc: Sign the plugin artifact (requires CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD env vars)
    cmds:
      - ./gradlew signPlugin
      - echo "✅ Signed artifact at {{.SIGNED_PLUGIN_ZIP}}"

  ci:release:
    desc: Publish the release if its PR was just merged, or else update the release PR (in CI, with the signed plugin built)
    cmds:
      - go run ./cmd/ci/release

  ci:release:test:
    desc: Test the release program
    cmds:
      - go vet ./cmd/...
      - go test ./cmd/...

version: '3'

vars:
  REPO: CircleCI-Public/circleci-jetbrains-plugin
  VERSION:
    sh: sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts
  BUILD_DIR: build/distributions
  PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-idea-plugin-{{.VERSION}}.zip"
  SIGNED_PLUGIN_ZIP: "{{.BUILD_DIR}}/circleci-idea-plugin-{{.VERSION}}-signed.zip"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development Tasks
  clean:
    desc: Clean build artifacts
    cmds:
      - ./gradlew clean

  build:
    desc: Build the plugin
    cmds:
      - ./gradlew buildPlugin
      - echo "✅ Plugin built at {{.PLUGIN_ZIP}}"

  test:
    desc: Run unit tests, verify plugin, and generate coverage report
    cmds:
      - ./gradlew test koverHtmlReport koverVerify verifyPlugin

  ui:start:
    desc: Start IDE with Remote Robot server for E2E testing
    cmds:
      - echo "🚀 Starting IDE with robot-server on port 8082..."
      - echo "💡 IDE will open in a new window. Keep this terminal running."
      - echo "💡 To run tests, open another terminal and run 'task ui:test'"
      - ./gradlew runIdeForUiTests

  ui:test:
    desc: Run E2E UI tests (requires IDE running via 'task ui:start')
    cmds:
      - ./gradlew test --tests "*E2ETest"

  ui:all:
    desc: Run all UI tests (starts IDE, runs tests, stops IDE)
    cmds:
      - echo "🚀 Starting IDE in background..."
      - ./gradlew runIdeForUiTests > /tmp/circleci-ui-test-ide.log 2>&1 &
      - echo $! > /tmp/circleci-ui-test-ide.pid
      - echo "⏳ Waiting for IDE to be ready (30 seconds)..."
      - sleep 30
      - echo "🧪 Running UI tests..."
      - ./gradlew test --tests "*E2ETest" || true
      - echo "🛑 Stopping IDE..."
      - kill $(cat /tmp/circleci-ui-test-ide.pid) || true
      - rm /tmp/circleci-ui-test-ide.pid
      - echo "✅ UI tests completed"

  run:
    desc: Launch IDE with plugin for testing
    cmds:
      - ./gradlew runIde

  # Static Analysis
  lint:
    desc: Run all static analysis (detekt, ktlint, security)
    cmds:
      - ./gradlew staticAnalysis

  format:
    desc: Auto-format code with ktlint
    cmds:
      - ./gradlew ktlintFormat

  # Release Tasks
  # Releases are made by merging the release PR, which CI keeps up to date with CHANGELOG.md's
  # [Unreleased] section. See RELEASE.md.
  sign:
    desc: Sign the plugin artifact (requires CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD env vars)
    cmds:
      - ./gradlew signPlugin
      - echo "✅ Signed artifact at {{.SIGNED_PLUGIN_ZIP}}"

  release-notes:
    desc: Print a version's release notes from CHANGELOG.md (`task release-notes -- 1.3.1`), or the unreleased ones
    cmds:
      - ./gradlew -q getChangelog --no-header --no-links --no-empty-sections {{if .VERSION_ARG}}--project-version={{.VERSION_ARG}}{{else}}--unreleased{{end}}
    vars:
      VERSION_ARG: '{{.CLI_ARGS}}'

  ci:release:pr:
    desc: Open, update or close the release PR for CHANGELOG.md's [Unreleased] section (requires GITHUB_TOKEN)
    cmds:
      - ./scripts/release-pr.sh

  ci:release:publish:
    desc: Publish this version to the JetBrains Marketplace and GitHub, unless it's already released (requires PUBLISH_TOKEN, GITHUB_TOKEN and the signing env vars)
    status:
      # Released already: the GitHub release is the last step, and makes the tag.
      - git ls-remote --exit-code --tags origin refs/tags/v{{.VERSION}}
    cmds:
      - ./gradlew -q getChangelog --project-version={{.VERSION}} --no-header --no-links --no-empty-sections --output-file=build/release-notes.md
      - ./gradlew publishPlugin
      - gh release create v{{.VERSION}}
        --repo {{.REPO}}
        --target "$(git rev-parse HEAD)"
        --title "v{{.VERSION}}"
        --notes-file build/release-notes.md
        {{.SIGNED_PLUGIN_ZIP}}
      - echo "✅ Released v{{.VERSION}}"
